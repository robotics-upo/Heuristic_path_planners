# ---------------------------------------------------------------------------
# Muestreo de salida
# ---------------------------------------------------------------------------
n_samples: 50

# ---------------------------------------------------------------------------
# Filtrado Ramer-Douglas-Peucker
# ---------------------------------------------------------------------------
rdp_epsilon: 1.0
max_segment_len: 20.0

# ---------------------------------------------------------------------------
# Pesos de las funciones de coste
# ---------------------------------------------------------------------------
# weight_wp       — adhesión al path original. Más alto = más fiel, menos suave.
weight_wp:       1000.0
# weight_fix_goal — restricción dura de llegada al goal. Debe ser >> weight_wp.
weight_fix_goal: 100000.0
# weight_smooth   — penaliza coeficientes de alto grado. Más alto = más suave.
weight_smooth:   100

# ---------------------------------------------------------------------------
# Opciones del solver Ceres
# ---------------------------------------------------------------------------
# Tipo de solver lineal interno:
#   DENSE_QR               — robusto, problemas pequeños/medianos
#   DENSE_SCHUR            — eficiente con muchas restricciones (recomendado)
#   SPARSE_NORMAL_CHOLESKY — problemas grandes con estructura dispersa
solver_linear_type:  "DENSE_SCHUR"

# Estrategia de región de confianza:
#   LEVENBERG_MARQUARDT    — robusto y estable (recomendado)
#   DOGLEG                 — más agresivo, puede ser más rápido
solver_trust_region: "LEVENBERG_MARQUARDT"

# Número máximo de iteraciones del solver.
solver_max_iterations: 500000

# Número de hilos de cómputo para el solver.
solver_num_threads: 4

# Permite al solver aceptar pasos que empeoran el coste momentáneamente
# para escapar de mínimos locales.
solver_nonmonotonic_steps: true

# Mostrar progreso del solver por pantalla (true = verbose).
solver_verbose: false
